# PostgreSQL para desenvolvimento e testes (Windows com Docker Desktop, Ubuntu e derivados).
#   docker compose up -d
# Cria os bancos "greencode" (aplicação) e "greencode_teste" (testes automatizados).
services:
  postgres:
    image: postgres:16
    container_name: greencode-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: greencode
      POSTGRES_PASSWORD: greencode
      POSTGRES_DB: greencode
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - dados-postgres:/var/lib/postgresql/data
      - ./scripts/criar-banco-teste.sql:/docker-entrypoint-initdb.d/criar-banco-teste.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greencode -d greencode"]
      interval: 5s
      retries: 10

volumes:
  dados-postgres:
